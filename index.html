<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NB SCRIPTS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root">
        <header class="header">
            <div class="container header-content">
                <div class="logo-wrapper">
                    <svg class="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/>
                    </svg>
                    <a href="#" class="logo">NB SCRIPTS</a>
                </div>
            </div>
        </header>

        <main class="container">
            <header class="scripts-header">
                <h1 id="page-title" class="page-title">Доступные скрипты</h1>
            </header>
            <ul id="scripts-grid" class="scripts-grid"></ul>
        </main>
    </div>

    <div id="iframe-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <iframe id="script-iframe" src="" title="Script Window"></iframe>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
